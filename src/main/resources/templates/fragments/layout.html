<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' - BRUTAL FITNESS'">BRUTAL FITNESS</title>
    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 py-2 border-bottom border-danger border-3 shadow-sm" style="background-color: #111827 !important;">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" th:href="@{/}">
            <span class="fs-4 me-2 text-danger fw-bold"><i class="bi bi-fire"></i></span>
            <div>
                <span class="fw-bold tracking-wide text-white">BRUTAL</span>
                <span class="fw-bold text-danger">FITNESS</span>
                <span class="d-block text-secondary small" style="font-size: 0.75rem;">Jr. José Santos Chocano - Jesús Nazareno</span>
            </div>
        </a>
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-auto gap-2">
                <li class="nav-item">
                    <a class="nav-link px-3 text-white" th:href="@{/}">
                        <i class="bi bi-grid-fill me-1 text-danger"></i> Inicio
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link px-3 text-white" th:href="@{/clientes}">
                        <i class="bi bi-people-fill me-1 text-danger"></i> Clientes
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link px-3 text-white" th:href="@{/membresias}">
                        <i class="bi bi-card-checklist me-1 text-danger"></i> Membresías
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link px-3 text-white" th:href="@{/pagos}">
                        <i class="bi bi-cash-coin me-1 text-danger"></i> Pagos
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link px-3 text-white" th:href="@{/asistencias}">
                        <i class="bi bi-clock-history me-1 text-danger"></i> Asistencias
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<footer th:fragment="footer" class="bg-dark text-white py-4 mt-auto border-top border-secondary" style="background-color: #111827 !important;">
    <div class="container text-center">
        <div class="fw-bold text-white mb-1">
            <span class="text-danger"><i class="bi bi-fire"></i></span> BRUTAL FITNESS
        </div>
        <div class="text-light small mb-1">
            <i class="bi bi-geo-alt-fill text-danger me-1"></i> Jirón José Santos Chocano — Distrito de Jesús Nazareno, Ayacucho
        </div>
        <div class="text-secondary small">
            Sistema de Gestión y Control de Clientes
        </div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
