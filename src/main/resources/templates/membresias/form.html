<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(titulo='Membresía')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <h2 th:text="${membresia.id} != null ? 'Editar Membresía' : 'Nueva Membresía'">Membresía</h2>

    <form th:action="@{/membresias/guardar}" th:object="${membresia}" method="post" class="row g-3">
        <input type="hidden" th:field="*{id}">

        <div class="col-md-6">
            <label class="form-label">Cliente</label>
            <select th:field="*{cliente}" class="form-select">
                <option value="">-- Seleccione --</option>
                <option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nombreCompleto}"></option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('cliente')}" th:errors="*{cliente}"></div>
        </div>

        <div class="col-md-6">
            <label class="form-label">Tipo de membresía</label>
            <select th:field="*{tipo}" class="form-select">
                <option value="">-- Seleccione --</option>
                <option th:each="t : ${tipos}" th:value="${t}" th:text="${t}"></option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}"></div>
        </div>

        <div class="col-md-6">
            <label class="form-label">Fecha de inicio</label>
            <input type="date" th:field="*{fechaInicio}" class="form-control">
            <div class="text-danger" th:if="${#fields.hasErrors('fechaInicio')}" th:errors="*{fechaInicio}"></div>
        </div>

        <div class="col-md-6">
            <label class="form-label">Fecha de vencimiento</label>
            <input type="date" th:field="*{fechaVencimiento}" class="form-control">
            <div class="text-danger" th:if="${#fields.hasErrors('fechaVencimiento')}" th:errors="*{fechaVencimiento}"></div>
        </div>

        <div class="col-12">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a th:href="@{/membresias}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>
