<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(titulo='Membresía')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <div class="card shadow-sm p-4 mx-auto" style="max-width: 800px; border-radius: 12px;">
        <h2 class="mb-4" th:text="${membresia.id} != null ? 'Editar Membresía' : 'Nueva Membresía'">Membresía</h2>

        <form th:action="@{/membresias/guardar}" th:object="${membresia}" method="post" class="row g-3" id="formMembresia">
            <input type="hidden" th:field="*{id}">

            <div class="col-md-6">
                <label class="form-label fw-bold">Cliente</label>
                <select th:field="*{cliente}" class="form-select" required>
                    <option value="">-- Seleccione un cliente --</option>
                    <option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nombreCompleto}"></option>
                </select>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('cliente')}" th:errors="*{cliente}"></div>
            </div>

            <div class="col-md-6">
                <label class="form-label fw-bold">Tipo de membresía</label>
                <select th:field="*{tipo}" class="form-select" id="selectTipo" required>
                    <option value="">-- Seleccione el tipo --</option>
                    <option th:each="t : ${tipos}" th:value="${t}" th:text="${t}"></option>
                </select>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}"></div>
            </div>

            <div class="col-md-6">
                <label class="form-label fw-bold">Fecha de inicio</label>
                <input type="date" th:field="*{fechaInicio}" class="form-control" id="inputFechaInicio" required>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('fechaInicio')}" th:errors="*{fechaInicio}"></div>
            </div>

            <div class="col-md-6">
                <label class="form-label fw-bold">Fecha de vencimiento</label>
                <input type="date" th:field="*{fechaVencimiento}" class="form-control" id="inputFechaVencimiento" required>
                <div class="form-text text-muted" id="infoVencimiento">
                    ✨ Calculada automáticamente según el tipo de membresía.
                </div>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('fechaVencimiento')}" th:errors="*{fechaVencimiento}"></div>
            </div>

            <div class="col-12 mt-4">
                <button type="submit" class="btn btn-primary px-4">Guardar</button>
                <a th:href="@{/membresias}" class="btn btn-secondary ms-2">Cancelar</a>
            </div>
        </form>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const inputInicio = document.getElementById('inputFechaInicio');
    const inputVencimiento = document.getElementById('inputFechaVencimiento');
    const selectTipo = document.getElementById('selectTipo');
    const infoVencimiento = document.getElementById('infoVencimiento');

    // Si la fecha de inicio esta vacia, poner la fecha de hoy
    if (!inputInicio.value) {
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        inputInicio.value = `${yyyy}-${mm}-${dd}`;
    }

    function calcularVencimiento() {
        if (!inputInicio.value) return;
        const tipo = selectTipo.value;
        if (!tipo) return;

        // Parsear fecha de inicio en local timezone
        const [year, month, day] = inputInicio.value.split('-').map(Number);
        const fecha = new Date(year, month - 1, day);

        if (tipo === 'DIARIO') {
            fecha.setDate(fecha.getDate() + 1);
            infoVencimiento.textContent = '✨ Válido por 1 día (calculado automáticamente).';
        } else if (tipo === 'SEMANAL') {
            fecha.setDate(fecha.getDate() + 7);
            infoVencimiento.textContent = '✨ Válido por 1 semana (7 días, calculado automáticamente).';
        } else if (tipo === 'MENSUAL') {
            fecha.setMonth(fecha.getMonth() + 1);
            infoVencimiento.textContent = '✨ Válido por 1 mes (calculado automáticamente).';
        } else if (tipo === 'TRIMESTRAL') {
            fecha.setMonth(fecha.getMonth() + 3);
            infoVencimiento.textContent = '✨ Válido por 3 meses (calculado automáticamente).';
        } else if (tipo === 'ANUAL') {
            fecha.setFullYear(fecha.getFullYear() + 1);
            infoVencimiento.textContent = '✨ Válido por 1 año (calculado automáticamente).';
        } else if (tipo === 'PERSONALIZADA') {
            infoVencimiento.textContent = '✏️ Modo personalizado: Puedes ingresar la fecha que desees.';
            return;
        }

        const yyyy = fecha.getFullYear();
        const mm = String(fecha.getMonth() + 1).padStart(2, '0');
        const dd = String(fecha.getDate()).padStart(2, '0');
        inputVencimiento.value = `${yyyy}-${mm}-${dd}`;
    }

    selectTipo.addEventListener('change', calcularVencimiento);
    inputInicio.addEventListener('change', calcularVencimiento);

    // Calcular si el usuario entra a la pantalla y fecha de vencimiento esta vacia
    if (!inputVencimiento.value || selectTipo.value) {
        calcularVencimiento();
    }
});
</script>
</body>
</html>
