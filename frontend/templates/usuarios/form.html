<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(titulo=${usuario.id == null ? 'Nuevo Usuario' : 'Editar Usuario'})}"></head>
<body class="bg-light d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container mb-5">
    <div class="card shadow-sm border-0 mx-auto" style="max-width: 600px; border-radius: 12px;">
        <div class="card-header bg-dark text-white py-3">
            <h2 class="h5 fw-bold mb-0">
                <i class="bi bi-person-gear text-danger me-2"></i>
                <span th:text="${usuario.id == null ? 'Registrar Nueva Cuenta de Usuario' : 'Editar Cuenta de Usuario'}"></span>
            </h2>
        </div>
        <div class="card-body p-4">
            <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post">
                <input type="hidden" th:field="*{id}" />
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="mb-3">
                    <label class="form-label fw-semibold text-dark">Nombre Completo:</label>
                    <input type="text" th:field="*{nombre}" class="form-control" placeholder="Ej: César Luza" required />
                    <div class="text-danger small" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold text-dark">Nombre de Usuario o DNI:</label>
                    <input type="text" th:field="*{username}" class="form-control" placeholder="Ej: admin, 72345678" required />
                    <div class="text-danger small" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold text-dark">Contraseña:</label>
                    <input type="password" th:field="*{password}" class="form-control" placeholder="••••••••" required />
                    <div class="text-muted small">La contraseña se encripta automáticamente con algoritmo BCrypt al guardar.</div>
                    <div class="text-danger small" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold text-dark">Rol en el Sistema:</label>
                    <select th:field="*{rol}" class="form-select" required>
                        <option value="">-- Seleccione un Rol --</option>
                        <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
                    </select>
                    <div class="text-danger small" th:if="${#fields.hasErrors('rol')}" th:errors="*{rol}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold text-dark">Vincular a Cliente (Opcional):</label>
                    <select th:field="*{cliente}" class="form-select">
                        <option value="">-- Ninguno / Usuario Administrativo --</option>
                        <option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nombreCompleto + ' (DNI: ' + c.dni + ')'}"></option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold text-dark">Vincular a Entrenador (Opcional):</label>
                    <select th:field="*{entrenador}" class="form-select">
                        <option value="">-- Ninguno / No es Entrenador --</option>
                        <option th:each="e : ${entrenadores}" th:value="${e.id}" th:text="${e.nombreCompleto + ' (' + e.especialidad + ')'}"></option>
                    </select>
                </div>

                <div class="form-check mb-4">
                    <input type="checkbox" th:field="*{activo}" class="form-check-input" id="activoCheck" />
                    <label class="form-check-label fw-semibold text-dark" for="activoCheck">Cuenta Activa</label>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/usuarios}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-danger fw-bold">Guardar Usuario</button>
                </div>
            </form>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
