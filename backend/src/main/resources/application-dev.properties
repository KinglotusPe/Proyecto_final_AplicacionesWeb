# ==========================================
# Perfil DEV — recarga en vivo de plantillas y recursos estaticos
# ==========================================

# Servir plantillas Thymeleaf directamente desde el codigo fuente (live reload)
# Ruta absoluta al repo montado en /app (ver docker-compose.base44.yml)
spring.thymeleaf.prefix=file:/app/frontend/templates/
spring.thymeleaf.cache=false

# Servir recursos estaticos (CSS/JS) desde el codigo fuente (live reload)
spring.web.resources.static-locations=file:/app/frontend/css/,file:/app/frontend/js/,classpath:/static/,classpath:/public/

# Respetar headers X-Forwarded-* del proxy de preview (HTTPS)
server.forward-headers-strategy=framework

# Esperar a que MySQL este listo al iniciar (reintenta hasta 60s)
spring.datasource.hikari.initialization-fail-timeout=60000
